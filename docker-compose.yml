services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flyrank
      POSTGRES_USER: flyrank
      POSTGRES_PASSWORD: flyrank
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flyrank -d flyrank"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    build: .
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: python -m app.workers.worker
  demo:
    image: python:3.12-slim
    working_dir: /demo
    volumes: ["./demo:/demo:ro"]
    ports: ["5500:5500"]
    command: python -m http.server 5500 --bind 0.0.0.0
